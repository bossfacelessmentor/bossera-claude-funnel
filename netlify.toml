# 301 redirects for renamed routes
[[redirects]]
  from = "/claude"
  to = "/ai"
  status = 301
  force = true

[[redirects]]
  from = "/thankyou-claude"
  to = "/access-confirmed-ai"
  status = 301
  force = true

[[redirects]]
  from = "/luxe-preview"
  to = "/luxe-preview.html"
  status = 200

[[headers]]
  for = "/luxe"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA fallback — must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
